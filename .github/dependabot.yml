version: 2
updates:
  # actions/checkout, setup-python, gitleaks-action in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # requirements_test.txt (test-only; runtime deps are pinned by HA core).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      test-deps:
        patterns: ["*"]
    ignore:
      # Runtime cryptography comes from HA core; keep the test floor at HA's
      # pin by hand instead of testing against versions HA does not ship.
      - dependency-name: cryptography
