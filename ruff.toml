# Ruff configuration. Pinned rule set so a ruff upgrade (pre-commit / CI)
# never changes what is checked without an explicit edit here.
target-version = "py313"

[lint]
# Codes we annotate with `noqa` on purpose but do not enforce (private
# access is idiomatic in diagnostics and tests); keeps RUF100 quiet on them.
external = ["SLF001"]
select = [
  "E4", "E7", "E9", "F",  # pycodestyle errors + pyflakes (ruff's classic defaults)
  "I",                    # import sorting
  "UP",                   # pyupgrade
  "BLE",                  # blind except: every `except Exception` is a deliberate `# noqa: BLE001`
  "RUF100",               # unused / stale `noqa` comments
]

[lint.per-file-ignores]
# Tests install HA/bleak stubs in sys.modules before importing the package.
"tests/*" = ["E402"]
