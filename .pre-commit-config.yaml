# Pre-commit hooks for haefele-connect-mesh-ha.
#
# Install once per clone:
#   pip install pre-commit
#   pre-commit install
#
# From then on, `git commit` runs these checks automatically. CI runs
# equivalents (tests.yml: ruff at the same version; gitleaks.yml) so
# nothing slips through a clone without pre-commit installed.

repos:
  # --- Secret scanning --------------------------------------------------
  # gitleaks catches BT Mesh NetKey / AppKey / DevKey accidentally
  # hard-coded in tests or fixtures. Config: .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)

  # --- Basic hygiene ----------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # --- Python lint (fast) ----------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2  # keep in sync with the ruff job in .github/workflows/tests.yml
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
